[tox]
envlist =
    lint
    typecheck
    oldest-numpy
    py310
    py311
    py312
    py313
    py314
    py315
skip_missing_interpreters = true

[testenv]
# Build an sdist once and install it into each env, so every interpreter
# compiles the transcoder from what a user would download.
package = sdist
extras = test
# Two runs against the installed package: the suite, and the worked examples in
# the docstrings, which need `--pyargs` to reach the installed copy.
commands =
    pytest {posargs:-q} -o testpaths=tests
    pytest -q --doctest-modules --pyargs opengl_basisu

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy
    numpy>=1.24
    pytest
commands = mypy src/opengl_basisu

# `dependencies` declares numpy>=1.24; this env installs that floor.
[testenv:oldest-numpy]
base_python = py310
deps =
    numpy==1.24.*
    pytest
commands_pre =
    python -c "import numpy; assert numpy.__version__.startswith('1.24'), 'resolved numpy ' + numpy.__version__; print('numpy: ' + numpy.__version__)"
commands =
    pytest {posargs:-q} -o testpaths=tests

# tox-gh maps a CI interpreter to the envs it runs (see .github/workflows).
[gh]
python =
    3.10 = py310, oldest-numpy
    3.11 = py311
    3.12 = lint, typecheck, py312
    3.13 = py313
    3.14 = py314
